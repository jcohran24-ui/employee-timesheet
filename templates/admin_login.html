<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"></head>
<body><div class="container py-5" style="max-width:620px"><div class="card shadow-sm"><div class="card-body p-4 p-md-5"><h1 class="h3">Supervisor / Admin</h1><p class="text-secondary">Sign in to manage employee accounts.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><label class="form-label fw-semibold">Admin Name</label><input class="form-control form-control-lg" name="admin_name" required><label class="form-label fw-semibold mt-3">PIN</label><input class="form-control form-control-lg" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,6}" minlength="4" maxlength="6" required><div class="d-grid mt-4"><button class="btn btn-dark btn-lg">Admin Sign In</button></div></form></div></div><p class="text-center mt-3"><a href="{{ url_for('employee_login') }}">Employee Login</a></p></div></body></html>
