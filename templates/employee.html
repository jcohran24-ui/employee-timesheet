<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Timesheet</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<div class="container py-5" style="max-width: 620px;">
  <div class="card shadow-sm">
    <div class="card-body p-4 p-md-5">
      <h1 class="h3 mb-2">Employee Timesheet</h1>
      <p class="text-secondary mb-4">Enter your full name to open your weekly timesheet.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <form method="post" action="{{ url_for('employee') }}">
        <label class="form-label fw-semibold" for="employee_name">Employee Name</label>
        <input class="form-control form-control-lg" id="employee_name" name="employee_name" maxlength="120" required autocomplete="name" value="{{ employee_name }}" placeholder="First and last name">
        <div class="d-grid mt-4">
          <button class="btn btn-primary btn-lg" type="submit">Open My Timesheet</button>
        </div>
      </form>
    </div>
  </div>
  <p class="small text-secondary text-center mt-3">Each employee name is stored separately.</p>
</div>
</body>
</html>
