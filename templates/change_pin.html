<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d6efd">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Timesheet">
  <link rel="manifest" href="{{ url_for('manifest') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <title>Change PIN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<div class="container py-5" style="max-width:560px">
  <div class="card shadow-sm">
    <div class="card-body p-4 p-md-5">
      <h1 class="h3 mb-2">Create Your PIN</h1>
      <p class="text-secondary">Welcome, <strong>{{ employee_name }}</strong>. Your current PIN is temporary. Choose a new 4–6 digit PIN before opening your timesheet.</p>
      {% with messages=get_flashed_messages(with_categories=true) %}
        {% for category,message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}
      {% endwith %}
      <form method="post" autocomplete="off">
        <div class="mb-3">
          <label class="form-label">New PIN</label>
          <input class="form-control form-control-lg" name="new_pin" type="password" inputmode="numeric" pattern="[0-9]{4,6}" minlength="4" maxlength="6" autocomplete="new-password" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label">Confirm New PIN</label>
          <input class="form-control form-control-lg" name="confirm_pin" type="password" inputmode="numeric" pattern="[0-9]{4,6}" minlength="4" maxlength="6" autocomplete="new-password" required>
        </div>
        <button class="btn btn-primary btn-lg w-100" type="submit">Save New PIN</button>
      </form>
      <form method="post" action="{{ url_for('logout') }}" class="mt-3">
        <button class="btn btn-link w-100" type="submit">Log Out</button>
      </form>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
